name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24] # 22 = floor (maintenance LTS); 24 = Active LTS deployers run
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx drizzle-kit generate
      - run: git diff --exit-code -- drizzle/
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          TZ: America/Chicago # the local-calendar backup-stamp test is a silent no-op on UTC runners
      - run: npm run build
        env:
          # build-time placeholder; runtime config comes from the deployer's .env
          APP_SECRET: ci-placeholder-secret-not-used-at-build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t sheetdiff-ci .
      - name: Boot + health probe
        run: |
          docker run -d --name sd-ci -p 3000:3000             -e APP_SECRET=ci-placeholder-secret-not-used-at-runtime             -e GOOGLE_CLIENT_ID=x -e GOOGLE_CLIENT_SECRET=y sheetdiff-ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && break || sleep 2
          done
          curl -sf http://localhost:3000/api/health | grep -q '"ok":true'
            curl -sf http://localhost:3000/ -o /dev/null # page render (catches SSR errors health won't)
          docker rm -f sd-ci
