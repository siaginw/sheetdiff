name: CI

on:
  push:
    branches: [main]
  pull_request:

# least privilege by default; jobs grant only what they need
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [22, 24] # 22 = floor (maintenance LTS); 24 = Active LTS deployers run
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
        env:
          HUSKY: "0" # never run git hooks in CI
      - run: npm run format:check
      - run: npx drizzle-kit generate
      - run: git diff --exit-code -- drizzle/
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
        env:
          TZ: America/Chicago # the local-calendar backup-stamp test is a silent no-op on UTC runners
      - run: npm run build
        env:
          # build-time placeholder; runtime config comes from the deployer's .env
          APP_SECRET: ci-placeholder-secret-not-used-at-build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          HUSKY: "0"
      # docs recommend NOT caching browsers — the download is ~10s and the OS
      # deps can't be cached anyway
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          APP_SECRET: ci-placeholder-secret-not-used-at-build
      - run: npx playwright test
        env:
          APP_SECRET: e2e-session-signing-key-not-secret
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker-build:
    # arm64 is free for public repos and matches how self-hosters actually
    # deploy this (NAS/Pi) — node:alpine + better-sqlite3 build fine on it
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t sheetdiff-ci .
      - name: Boot + health probe
        run: |
          docker run -d --name sd-ci -p 3000:3000 \
            -e APP_SECRET=ci-placeholder-secret-not-used-at-runtime \
            -e GOOGLE_CLIENT_ID=x -e GOOGLE_CLIENT_SECRET=y sheetdiff-ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && break || sleep 2
          done
          curl -sf http://localhost:3000/api/health | grep -q '"ok":true'
          curl -sf http://localhost:3000/ -o /dev/null # page render (catches SSR errors health won't)
          docker rm -f sd-ci
